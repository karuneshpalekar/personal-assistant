name: PersonalAssistant
options:
  bundleIdPrefix: com.karunesh.personalassistant
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "15.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7M9QHX569W
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targets:
  PersonalAssistantApp:
    type: application
    platform: macOS
    sources:
      - path: KanbanApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karunesh.personalassistant.app
        PRODUCT_NAME: PersonalAssistant
        ENABLE_HARDENED_RUNTIME: false
    info:
      path: KanbanApp/Info.plist
      properties:
        CFBundleDisplayName: Personal Assistant
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSRemindersFullAccessUsageDescription: "Personal Assistant can sync your tasks to Reminders so due-date alerts also show up on your iPhone via iCloud."
        NSRemindersUsageDescription: "Personal Assistant can sync your tasks to Reminders so due-date alerts also show up on your iPhone via iCloud."

schemes:
  PersonalAssistant:
    build:
      targets:
        PersonalAssistantApp: all
    run:
      config: Debug
    archive:
      config: Release
