name: KanbanTimeline
options:
  bundleIdPrefix: com.karunesh.kanbantimeline
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "15.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES

targets:
  KanbanApp:
    type: application
    platform: macOS
    sources:
      - path: KanbanApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karunesh.kanbantimeline.app
        PRODUCT_NAME: KanbanTimeline
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: KanbanApp/Info.plist
      properties:
        CFBundleDisplayName: Kanban Timeline
        LSUIElement: true
        NSHumanReadableCopyright: ""
    dependencies:
      - target: KanbanWidgetExtension
        embed: true

  KanbanWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: KanbanWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karunesh.kanbantimeline.app.widget
        PRODUCT_NAME: KanbanWidgetExtension
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: KanbanWidget/Info.plist
      properties:
        CFBundleDisplayName: Kanban Timeline Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  KanbanTimeline:
    build:
      targets:
        KanbanApp: all
        KanbanWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
