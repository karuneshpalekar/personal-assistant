name: KanbanTimeline
options:
  bundleIdPrefix: com.karunesh.kanbantimeline
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  KanbanApp:
    type: application
    platform: macOS
    sources:
      - path: KanbanApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karunesh.kanbantimeline.app
        PRODUCT_NAME: KanbanTimeline
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: KanbanApp/Info.plist
      properties:
        CFBundleDisplayName: Kanban Timeline
        LSUIElement: true
        NSHumanReadableCopyright: ""
    entitlements:
      path: KanbanApp/KanbanApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.karunesh.kanbantimeline
    dependencies:
      - target: KanbanWidgetExtension
        embed: true

  KanbanWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: KanbanWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karunesh.kanbantimeline.app.widget
        PRODUCT_NAME: KanbanWidgetExtension
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: KanbanWidget/Info.plist
      properties:
        CFBundleDisplayName: Kanban Timeline Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KanbanWidget/KanbanWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.karunesh.kanbantimeline

schemes:
  KanbanTimeline:
    build:
      targets:
        KanbanApp: all
        KanbanWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
